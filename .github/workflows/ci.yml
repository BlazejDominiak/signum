name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==83.0.0
          pip install --build-constraint constraints.txt -c constraints.txt -e .[dev]
      - name: Dependency audit
        run: pip-audit
      - name: Ruff
        run: ruff check src tests scripts
      - name: Keep local documents out of releases
        run: python scripts/check_local_documents.py
      - name: Mypy
        run: mypy
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Build test installer
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          # Reuse the configured interpreter; no extra environment is needed on the runner.
          ./scripts/build_installer.ps1 -Python (Get-Command python).Source
      - name: Install, upgrade, headless failure, uninstall
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          $version = python -c "import signum; print(signum.__version__)"
          ./scripts/test_installer.ps1 -Installer "$pwd/installer/output/Signum-Setup-$version.exe"
