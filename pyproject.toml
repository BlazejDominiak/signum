[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "signum"
dynamic = ["version"]
description = "Desktop app that detects handwritten signatures, initials, stamps and digital signatures in PDFs and scanned documents using a local (Ollama) or cloud vision model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Signum contributors" }]
keywords = ["signature-detection", "pdf", "ocr", "ollama", "vision-llm", "desktop", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Polish",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "PySide6>=6.7",
    "pypdfium2>=4.30",
    "pypdf>=6.19.0",
    "Pillow>=10.4",
    "requests>=2.32",
    "platformdirs>=4.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=2.3.0",
    "types-requests",
    "pyinstaller>=6.10",
    "reportlab>=4.0",
    "pyhanko>=0.25",
    "pip-audit>=2.10.1",
    "hatchling==1.31.0",
]

[project.gui-scripts]
signum = "signum.app:main"

[project.scripts]
signum-cli = "signum.cli:main"

[tool.hatch.version]
path = "src/signum/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/signum"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "RUF",      # ruff-specific
    "PLC", "PLE", "PLW",  # pylint (bez opiniotwórczych PLR)
]

# Polskie teksty UI/raportów używają typograficznych „–", „×", cudzysłowów.
allowed-confusables = ["–", "—", "×", "’"]

[tool.ruff.lint.isort]
known-first-party = ["signum", "tests"]

[tool.ruff.lint.per-file-ignores]
# W testach importy lokalne w funkcjach są czytelniejsze (izolują zależności).
"tests/**" = ["PLC0415", "PLC1901"]
# Prompt to jeden spójny blok tekstu — łamanie linii psuje czytelność wskazówek.
"src/signum/ai/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["signum"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "reportlab.*", "pyhanko.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q"
